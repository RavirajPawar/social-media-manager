version: '3.8'

services:
  llm-engine:
    build:
      context: .
      dockerfile: Dockerfile.llm-engine
    container_name: llm-engine
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434  # Add this line to specify the host and port
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 30s  # Increased timeout for model loading
      retries: 10
      start_period: 60s  # Give it time to download the model

  social-media-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: social-media-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      llm-engine:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data: